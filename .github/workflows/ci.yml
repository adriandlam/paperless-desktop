name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: make lint
      - run: make test
      - name: Build (unsigned)
        run: |
          xcodegen generate
          xcodebuild -scheme PaperlessDesktop -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
